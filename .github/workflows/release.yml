name: Release

# Une version = un tag « vX.Y.Z » poussé. Les binaires sont compilés ici, par
# GitHub, à partir du code public : personne ne les fabrique sur sa machine.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write # image Docker sur ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # le jeton GitHub ne reste pas sur le disque
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # compilation propre à chaque version
      - run: go test ./...
      - name: Compilation
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          mkdir dist
          # Agent de seedbox (Linux amd64 et arm64), embarqué dans chaque binaire.
          sh scripts/build-agents.sh "$v"
          # Windows : application graphique (pas de console), icône et
          # informations de version dans le .exe.
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --manifest gui \
            --icon internal/desktop/d3x-256.png --product-name D3X --file-description D3X \
            --product-version "$v" --file-version "$v" --original-filename d3x.exe
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; gui=""
            if [ "$os" = windows ]; then ext=".exe"; gui="-H windowsgui"; fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -ldflags "-s -w -buildid= $gui -X main.version=$v" \
              -o "dist/d3x_${os}_${arch}${ext}" .
          done
          rm -f rsrc_windows_*.syso
          cd dist && sha256sum d3x_* > checksums.txt
      - name: Signature des empreintes
        env:
          D3X_SIGNING_KEY: ${{ secrets.D3X_SIGNING_KEY }}
        run: |
          # Clé ed25519 (PEM) gardée en secret du dépôt ; sans elle, pas de signature.
          if [ -n "$D3X_SIGNING_KEY" ]; then
            printf '%s\n' "$D3X_SIGNING_KEY" > key.pem
            openssl pkeyutl -sign -inkey key.pem -rawin -in dist/checksums.txt -out dist/checksums.txt.sig
            # Fiche de la version, signée : la mise à jour n'installe que la
            # version annoncée (jamais une ancienne sous un nouveau numéro).
            printf 'D3X %s\n%s\n' "${GITHUB_REF_NAME#v}" "$(sha256sum dist/checksums.txt | cut -d' ' -f1)" > dist/release.txt
            openssl pkeyutl -sign -inkey key.pem -rawin -in dist/release.txt -out dist/release.txt.sig
            rm -f key.pem
          fi
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "D3X ${GITHUB_REF_NAME#v}" --generate-notes
      # L'image part d'Alpine (binaire mediainfo) : l'étape apk de la variante
      # arm64 tourne sous QEMU sur le runner amd64.
      - name: QEMU (image arm64)
        uses: docker/setup-qemu-action@v3
      - name: Image Docker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/d3x"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          # Mêmes binaires que la version publiée (dist/), pour amd64 et arm64.
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$v" \
            --label "org.opencontainers.image.title=D3X" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "$img:$v" -t "$img:latest" --push .
