name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # compilation propre à chaque passage
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Compilation croisée
        run: |
          for t in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null . || exit 1
          done
      # L'image part d'Alpine (binaire mediainfo) : l'étape apk de la variante
      # arm64 tourne sous QEMU sur le runner amd64.
      - name: QEMU (image arm64)
        uses: docker/setup-qemu-action@v3
      - name: Image Docker (construite et lancée, pas publiée)
        run: |
          set -e
          sh scripts/build-agents.sh ci
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=0.0.0-ci" -o dist/d3x_linux_$arch .
          done
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 .
          docker buildx build --platform linux/amd64 --load -t d3x:ci .
          docker run -d --name d3x -p 8733:8733 d3x:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' d3x)" = healthy ] && break
            sleep 2
          done
          docker logs d3x
          test "$(docker inspect -f '{{.State.Health.Status}}' d3x)" = healthy
          test "$(curl -fsS http://127.0.0.1:8733/health)" = D3X
          # Le lien du journal ouvre la page ; un mauvais jeton est refusé.
          t=$(docker logs d3x 2>&1 | sed -n 's/.*auth?t=\([0-9a-f]*\).*/\1/p' | head -1)
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8733/auth?t=$t")" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8733/auth?t=faux")" = 403
          # Le jeton survit à un redémarrage (rangé dans /config).
          docker restart d3x >/dev/null && sleep 3
          docker logs d3x 2>&1 | grep -c "auth?t=$t" | grep -q 2
